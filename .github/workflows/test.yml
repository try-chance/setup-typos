name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test on ${{ matrix.os }} (${{ matrix.version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        version: [latest]
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
          - windows-11-arm
        include:
          - os: windows-11-arm
            version: 1.51.1

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run package

      - name: Setup typos
        id: setup-typos
        uses: ./
        with:
          version: ${{ matrix.version }}
          github-token: ${{ github.token }}

      - name: Verify typos is on PATH
        run: typos --version
